[package]
name = "lfs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../../README.md"
[[bin]]
name = "lfs"
path = "src/main.rs"
[features]
default = []
bundled = ["lfs-sqlite/bundled"]

[dependencies]
lfs-sqlite.workspace = true
lfs-protocol.workspace = true
lfs-storage = { path = "../../integrations/opendal", version = "=0.1.0", features = ["fs", "webdav", "s3", "drive-experimental"] }
tokio.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite.workspace = true
