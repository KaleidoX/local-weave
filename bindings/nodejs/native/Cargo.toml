[package]
name = "lfs-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../../../README.md"

[lib]
crate-type = ["cdylib"]

[features]
default = []
bundled = ["lfs-sqlite/bundled"]

[dependencies]
lfs-sqlite.workspace = true
lfs-protocol.workspace = true
lfs-storage = { path = "../../../integrations/opendal", version = "=0.1.0", features = ["fs", "webdav", "s3"] }
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.12"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio.workspace = true
rusqlite.workspace = true

[build-dependencies]
napi-build = "=2.6.0"
